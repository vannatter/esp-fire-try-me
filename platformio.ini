; esp-fire-try-me — fires two animatronics' Try-Me on a nightly schedule.
;
; Build/flash:  pio run -t upload
; Monitor:      pio device monitor   (115200)

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Wireless (OTA) flashing once the board already runs OTA firmware:
;   pio run -e esp32_ota -t upload
[env:esp32_ota]
extends = env:esp32
upload_protocol = espota
upload_port = 192.168.71.204
upload_flags = --auth=frankenlab
