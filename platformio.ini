; esp-fire-try-me — fires two animatronics' Try-Me on a nightly schedule.
;
; Build/flash:  pio run -t upload
; Monitor:      pio device monitor   (115200)

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Wireless (OTA) flashing once the board already runs OTA firmware: use
;   ./ota.sh
; It builds with this env and uploads over WiFi via espota.py. (Do NOT add
; `upload_protocol = espota` here: the espressif32 platform compiles much larger
; in OTA mode. ota.sh uploads the normal binary instead.)
